# Telugu queue (4 Nov 2026): the factory renders English at once and queues Telugu here. One at a time (the ONE free
# Kaggle GPU voices Telugu, and free Gemini writes it): when the previous Telugu render has finished, take the next part,
# let Gemini write its Telugu into the same scenes (factory/te_fill.py), then start its render. Every 20 minutes.
name: te-queue
on:
  schedule: [{ cron: '*/20 * * * *' }]
  workflow_dispatch:
concurrency: { group: te-queue, cancel-in-progress: false }
permissions: { contents: read, actions: write, id-token: write }
jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Next Telugu part
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          R2="python3 r2.py"
          NEXT=$($R2 list work/factory/te-queue/ | awk '{print $3}' | sort | head -1)
          [ -n "$NEXT" ] || { echo "Telugu queue empty"; exit 0; }
          if $R2 get jobs/factory/te-active.json act.json 2>/dev/null; then
            ID=$(jq -r .video_id act.json); AT=$(jq -r .at act.json)
            ST=$($R2 get "jobs/$ID.json" st.json 2>/dev/null && jq -r .state st.json || echo none)
            AGE=$(( $(date +%s) - $(date -d "$AT" +%s) ))
            if [ "$ST" != "done" ] && [ "$ST" != "failed" ] && [ $AGE -lt 21600 ]; then echo "busy: $ID ($ST, ${AGE}s)"; exit 0; fi
            echo "previous: $ID $ST"
          fi
          $R2 get "$NEXT" req.json
          ID=$(jq -r .video_id req.json); PID=$(jq -r .part_id req.json); SUBJ=$(jq -r .subject req.json); CH=$(jq -r .chapter req.json)
          # Telugu lines into the English spec (Gemini); if Gemini's free quota is used up, try again next round
          $R2 get "$(jq -r .src req.json)" s.tgz && mkdir w && tar -xzf s.tgz -C w
          sudo python3 -m pip install -q --break-system-packages num2words wordfreq
          python3 factory/split.py w/notes "$SUBJ" "$CH" parts > /dev/null
          if [ "$(jq -r '.te_pending // false' w/src/lessons/auto/$PID.json)" = "true" ]; then
            $R2 get "jobs/factory/$SUBJ/$PID.md" rep.md 2>/dev/null || touch rep.md
            if ! python3 factory/te_fill.py w/src/lessons/auto/$PID.json parts/$PID.json w rep.md; then
              $R2 put rep.md "jobs/factory/$SUBJ/$PID.md"; echo "::warning::$PID Telugu not complete yet — retry next round"; exit 0
            fi
            $R2 put rep.md "jobs/factory/$SUBJ/$PID.md"; $R2 put w/src/lessons/auto/$PID.json "jobs/factory/$SUBJ/$PID.json"
            tar -czf te.tgz --exclude=node_modules -C w . && $R2 put te.tgz "work/factory/src/$PID-te.tgz"
            jq --arg s "work/factory/src/$PID-te.tgz" '.src = $s' req.json > r2.json && mv r2.json req.json
          fi
          echo '{"state":"queued"}' > st.json; $R2 put st.json "jobs/$ID.json"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/render.yml/dispatches" -f ref=main -f "inputs[req]=$(jq -c 'del(.part_id, .subject, .chapter)' req.json)"
          jq -n --arg id "$ID" --arg at "$(date -u +%FT%TZ)" '{video_id: $id, at: $at}' > act.json
          $R2 put act.json jobs/factory/te-active.json && $R2 rm "$NEXT"
          echo "started Telugu render $ID; left in queue: $($R2 list work/factory/te-queue/ | wc -l)"
