# Public render runner (free, unlimited minutes for public repos). Contains NO course content.
# Trigger: Claude pushes queue/request.json (commit message = video id). The private project arrives as a tarball
# from private storage (src/<sha>.tgz); voice + pieces pass through private storage work/<video_id>/<run_id>/
# (kept 7 days so one bad piece can be re-made). No GitHub artifacts. Newest request for a video cancels older runs.
# request.json: { "video_id", "chapter_id", "src": "src/<sha>.tgz", "lesson": "src/lessons/jr-x.ts", "spec": "jrXSpec",
#   "comp": "JrXEN", "lang": "en"|"te", "chunks": 12, "voice_tar": "voice/x.tgz" (optional), "te_shards": 16 (optional) }
# Sub-project mode (Bit Badi Vox engine): "proj": "channels/bitbadi/vox-en" (+ "comp": "EpTE", "lang": "te"). The project
#   folder has its own package.json (entry src/index.tsx); sentences come from proj tools/te_timeline.py; the joined voice +
#   timings + Bit's mouth data are built in `plan` and passed to the pieces.
# "reuse": "<run_id>" — take that earlier run's voice (voice-all.tgz) and finished pieces instead of making them again
#   (e.g. only the last step failed). Pieces missing there are rendered as usual.
# "redo": ["05.3.2", ...] + "te_from": "<run_id>" — voice only these sentences again; all others come from that run's voice.
name: render
run-name: ${{ github.event.head_commit.message || 'render (manual)' }}
on:
  push:
    branches: [main]
    paths: ['queue/request.json']
  workflow_dispatch:   # video factory (4 Nov 2026): the request comes as an input instead of queue/request.json
    inputs:
      req: { description: 'request.json content', required: false, default: '' }

concurrency: { group: "render-${{ github.run_id }}", cancel-in-progress: false }
permissions: { contents: read, actions: write, id-token: write }

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      req: ${{ steps.req.outputs.req }}
      shards: ${{ steps.voice.outputs.shards }}
      colabwait: ${{ steps.voice.outputs.colabwait }}
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - id: req
        run: echo "req=$(jq -c . queue/request.json)" >> "$GITHUB_OUTPUT"
      - name: No double runs — cancel older runs of the same video
        if: ${{ github.event_name == 'push' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ID=$(jq -r .video_id queue/request.json)
          for st in queued in_progress; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/render.yml/runs?status=$st&per_page=50" -q '.workflow_runs[]|"\(.id) \(.head_sha)"'
          done | while read rid sha; do
            [ "$rid" -lt "$GITHUB_RUN_ID" ] || continue
            other=$(gh api "repos/$GITHUB_REPOSITORY/contents/queue/request.json?ref=$sha" -q .content | base64 -d | jq -r .video_id)
            if [ "$other" = "$ID" ]; then echo "cancel older run $rid"; gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$rid/cancel" || true; fi
          done
      - name: Status → started
        run: |
          ID=$(jq -r .video_id queue/request.json)
          echo "{\"state\":\"started\",\"runner\":\"public\",\"run\":\"$GITHUB_RUN_ID\",\"at\":\"$(date -u +%FT%TZ)\"}" > s.json
          python3 r2.py put s.json "jobs/$ID.json"
      - name: Private project
        run: python3 r2.py get "$(jq -r .src queue/request.json)" src.tgz && mkdir w && tar -xzf src.tgz -C w
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: w/package-lock.json }
      - id: voice
        name: Voice plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); L=$(jq -r '.lang // "en"' $R)
          cd w
          if [ "$(jq -r '.voice_tar // empty' $R)" != "" ]; then echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          P=$(jq -r '.proj // empty' $R)
          if [ -n "$(jq -r '.colab_voice // empty' $R)" ]; then   # 6 Nov 2026: voice made on Colab (colab/roach_voice.ipynb)
            python3 $GITHUB_WORKSPACE/r2.py get "work/colab/sent/$ID.json" s.json && python3 $GITHUB_WORKSPACE/r2.py put s.json "work/$ID/$GITHUB_RUN_ID/sentences.json"
            echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$(jq -r '.reuse // empty' $R)" ]; then
            python3 $GITHUB_WORKSPACE/r2.py get "work/$ID/$(jq -r .reuse $R)/sentences.json" s.json 2>/dev/null && python3 $GITHUB_WORKSPACE/r2.py put s.json "work/$ID/$GITHUB_RUN_ID/sentences.json" || true
            echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$P" ]; then
            python3 $P/tools/te_timeline.py sentences sentences.json
            if [ "$(jq -r '.redo // [] | length' $R)" != "0" ]; then
              jq --argjson keep "$(jq -c '.redo' $R)" 'with_entries(select(.key as $k | ($keep | index($k)) or ($keep | index($k + "_0"))))' sentences.json > s2.json && mv s2.json sentences.json   # redo ids may carry voice_te's "_0" line suffix
              echo "re-voicing $(jq length sentences.json) sentences"
            fi
            python3 $GITHUB_WORKSPACE/r2.py put sentences.json "work/$ID/$GITHUB_RUN_ID/sentences.json"
            N=$(jq -r '.te_shards // 16' $R); [ "$(jq -r '.colab // false' $R)" = "true" ] || echo "shards=$(jq -nc "[range($N)]")" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm ci --no-audit --no-fund --silent
          node tools/export_sentences.mjs "$(jq -r .lesson $R)" "$(jq -r .spec $R)" "$L" sentences.json
          python3 $GITHUB_WORKSPACE/r2.py put sentences.json "work/$ID/$GITHUB_RUN_ID/sentences.json"
          if [ "$L" = "te" ]; then
            N=$(jq -r '.te_shards // 16' $R); [ "$(jq -r '.colab // false' $R)" = "true" ] || echo "shards=$(jq -nc "[range($N)]")" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ]; then
            # 5 Nov 2026: English in CHIJOBHA's own voice (his samples E/G) — the Telugu voice engine reads the English
            # written in Telugu letters (factory/en_letters.py); voiced on the same GPU/CPU path as Telugu.
            sudo python3 -m pip install -q --break-system-packages num2words wordfreq
            python3 $GITHUB_WORKSPACE/factory/en_letters.py sentences.json sentences-voice.json
            python3 $GITHUB_WORKSPACE/r2.py put sentences-voice.json "work/$ID/$GITHUB_RUN_ID/sentences-voice.json"
            N=$(jq -r '.te_shards // 16' $R); [ "$(jq -r '.colab // false' $R)" = "true" ] || echo "shards=$(jq -nc "[range($N)]")" >> "$GITHUB_OUTPUT"
          else
            # system-wide install (4 Nov 2026): a user-site install was invisible to tools/missing_terms.py ("No module named wordfreq")
            sudo python3 -m pip install -q --break-system-packages kokoro-onnx soundfile wordfreq
            python3 -I -c "import wordfreq, kokoro_onnx, soundfile"   # fail early and clearly if the English voice tools are missing
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg espeak-ng >/dev/null
            KOKORO_DIR=$HOME/kokoro-model bash tools/setup_kokoro.sh
            for py in $HOME/kokoro-model/*/bin/python3; do [ -x "$py" ] && "$py" -m pip install -q wordfreq || true; done   # if setup made its own Python
            # new words (factory word lists) are heard back first; a word that cannot be made clear stops the render (rule 5)
            sudo python3 -m pip install -q --break-system-packages --ignore-installed typing_extensions faster-whisper   # debian's typing_extensions cannot be uninstalled
            set +e; KOKORO_DIR=$HOME/kokoro-model python3 -I tools/pron_listen.py sentences.json $RUNNER_TEMP/pron.json "$(jq -r '.voice // "roki-in50"' $R)"; PR=$?; set -e
            python3 $GITHUB_WORKSPACE/r2.py put $RUNNER_TEMP/pron.json "work/$ID/$GITHUB_RUN_ID/pron.json"
            [ $PR = 0 ] || { echo "::error title=new words::$(jq -r '.unclear | join(", ")' $RUNNER_TEMP/pron.json) not heard clearly — fix their spelling"; exit 1; }
            SPEED="$(jq -r '.speed // 1.06' $R)" KOKORO_DIR=$HOME/kokoro-model OUT=$RUNNER_TEMP bash tools/chapter.sh voice "$(jq -r .lesson $R)" "$(jq -r .spec $R)" "$(jq -r .comp $R)" "$(jq -r '.voice // "roki-in50"' $R)"
            tar -czf en-voice.tgz -C public/voice/en .
            python3 $GITHUB_WORKSPACE/r2.py put en-voice.tgz "work/$ID/$GITHUB_RUN_ID/en-voice.tgz"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          fi
          # 6 Nov 2026 — "colab": true: the voice is made on Google Colab (CHIJOBHA presses Run all in colab/roach_voice.ipynb).
          # The job goes to work/colab/jobs/<id>/ (sentences in his-voice form + voice engine + his clip); this run stops here.
          # When Colab has made the voice it writes work/colab/ready/<id>.json and the re-voice queue starts the render again.
          if [ "$(jq -r '.colab // false' $R)" = "true" ] && { [ "$L" = "te" ] || [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ]; }; then
            mkdir -p cj/tools && cp tools/voice_te.py cj/tools/
            if [ "$L" = "te" ]; then cp sentences.json cj/sentences.json; REF=$(jq -r '.te_ref // "voices/te-chijobha/ref.wav"' $R); mkdir -p cj/$(dirname $REF); cp $(dirname $REF)/ref.wav $(dirname $REF)/ref.txt cj/$(dirname $REF)/
            else cp sentences-voice.json cj/sentences.json; REF=voices/en-chijobha/ref.wav; mkdir -p cj/voices/en-chijobha
              python3 $GITHUB_WORKSPACE/r2.py get voice/en-chijobha/ref.wav cj/voices/en-chijobha/ref.wav && python3 $GITHUB_WORKSPACE/r2.py get voice/en-chijobha/ref.txt cj/voices/en-chijobha/ref.txt; fi
            jq -n --arg ref "$REF" --arg flow "$(jq -r '.te_flow // empty' $R)" --arg sp "$(jq -r '.te_speed // empty' $R)" '{TE_REF: $ref, TE_FLOW: $flow, TE_SPEED: $sp}' > cj/env.json
            tar -czf payload.tgz -C cj .
            python3 $GITHUB_WORKSPACE/r2.py put sentences.json "work/colab/sent/$ID.json"
            python3 $GITHUB_WORKSPACE/r2.py put payload.tgz "work/colab/jobs/$ID/payload.tgz"
            jq -c --arg at "$(date -u +%FT%TZ)" '{req: (del(.colab) + {colab_voice: ("work/colab/done/" + .video_id + ".tgz")}), at: $at, n: 0}' $R > job.json
            jq --argjson n "$(jq '[.[]|length]|add' cj/sentences.json)" '.n = $n' job.json > j2.json && python3 $GITHUB_WORKSPACE/r2.py put j2.json "work/colab/jobs/$ID/job.json"
            echo "{\"state\":\"waiting for voice (Colab)\",\"run\":\"$GITHUB_RUN_ID\",\"at\":\"$(date -u +%FT%TZ)\"}" > s.json && python3 $GITHUB_WORKSPACE/r2.py put s.json "jobs/$ID.json"
            echo "shards=[]" >> "$GITHUB_OUTPUT"; echo "colabwait=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Colab::voice job for $ID is waiting — press Run all in the Roach voice notebook"
          fi

  tegpu:     # Telugu voice on a GPU first: Modal, Kaggle, RunPod, Vast.ai in turn (gpu/voice.py; order in queue/gpu-order).
             # Only platforms whose secrets are saved are tried. If none finishes, tevoice (16 CPU machines) takes over.
    needs: prep
    if: ${{ needs.prep.outputs.shards != '[]' && needs.prep.outputs.shards != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      ok: ${{ steps.k.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - id: k
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          # "no_gpu": true — skip all GPUs. 31 Oct 2026: Kaggle GPU voice failed the final check (sentence 01.1.6 scored 0.22 vs 0.95 on CPU)
          [ "$(jq -r '.no_gpu // false' queue/request.json)" != "true" ] || { echo "no_gpu requested - using CPU machines"; exit 0; }
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
          if [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ]; then   # English in his voice: his English clip + Telugu-letters lines
            python3 r2.py get "work/$ID/$RUN/sentences-voice.json" sentences.json
            mkdir -p w/voices/en-chijobha && python3 r2.py get voice/en-chijobha/ref.wav w/voices/en-chijobha/ref.wav && python3 r2.py get voice/en-chijobha/ref.txt w/voices/en-chijobha/ref.txt
            jq '.te_ref = "voices/en-chijobha/ref.wav"' $R > r2.json && mv r2.json $R
          fi
          export ONLY="$(jq -r '.redo // [] | join(",")' $R)" TE_REF="$(jq -r '.te_ref // empty' $R)" TE_FLOW="$(jq -r '.te_flow // empty' $R)" GPU_ORDER="$(jq -r '.gpu_order // empty' $R)" TE_SPEED="$(jq -r '.te_speed // empty' $R)"
          python3 gpu/voice.py w sentences.json gpu-out "$ID" "$RUN"
          for f in gpu-out/*.tgz; do python3 r2.py put "$f" "work/$ID/$RUN/te/$(basename "$f")"; done
          echo "ok=true" >> "$GITHUB_OUTPUT"

  tevoice:   # Telugu in CHIJOBHA's copied voice, split over many machines (fallback when the Kaggle GPU is unavailable)
    needs: [prep, tegpu]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.shards != '[]' && needs.prep.outputs.shards != '' && needs.tegpu.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one machine's hiccup must not stop the other 15; re-run only the failed shard
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Telugu voice shard ${{ matrix.shard }}
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); N=$(jq -r '.te_shards // 16' $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/sentences.json" sentences.json
          if [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ]; then   # English in his voice: his English clip + Telugu-letters lines
            python3 r2.py get "work/$ID/${{ github.run_id }}/sentences-voice.json" sentences.json
            mkdir -p w/voices/en-chijobha && python3 r2.py get voice/en-chijobha/ref.wav w/voices/en-chijobha/ref.wav && python3 r2.py get voice/en-chijobha/ref.txt w/voices/en-chijobha/ref.txt
            jq '.te_ref = "voices/en-chijobha/ref.wav"' $R > r2.json && mv r2.json $R
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          sleep $(( ${{ matrix.shard }} * 4 ))   # stagger the 1.4 GB model downloads
          bash w/tools/setup_indicf5.sh 2>&1 | tail -3
          # "redo" (Journal, 4 Nov 2026): voice only those <scene>_<i> lines; the rest come from "te_from" in plan
          # "te_ref" / "te_flow" (5 Nov 2026, optional): another clip of CHIJOBHA's voice (path inside the project + ref.txt
          # beside it) and the delivery mode, so a video keeps the reference it was started with. Unset = defaults as before.
          if [ -n "$(jq -r '.te_ref // empty' $R)" ]; then export TE_REF="$PWD/w/$(jq -r .te_ref $R)"; fi
          if [ -n "$(jq -r '.te_flow // empty' $R)" ]; then export TE_FLOW="$(jq -r .te_flow $R)"; fi
          if [ -n "$(jq -r '.te_speed // empty' $R)" ]; then export TE_SPEED="$(jq -r .te_speed $R)"; fi
          ONLY="$(jq -r '.redo // [] | join(",")' $R)" SHARD="${{ matrix.shard }}/$N" python3 w/tools/voice_te.py sentences.json te-out > /dev/null
          tar -czf te-${{ matrix.shard }}.tgz -C te-out .
          python3 r2.py put te-${{ matrix.shard }}.tgz "work/$ID/${{ github.run_id }}/te/te-${{ matrix.shard }}.tgz"

  plan:
    needs: [prep, tegpu, tevoice]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.colabwait != 'true' && (needs.tegpu.outputs.ok == 'true' || needs.tevoice.result == 'success' || (needs.tevoice.result == 'skipped' && needs.prep.outputs.shards == '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ranges: ${{ steps.plan.outputs.ranges }}
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - id: plan
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); L=$(jq -r '.lang // "en"' $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          P=$(jq -r '.proj // empty' $R)
          if [ -n "$P" ]; then
            U=$(jq -r '.reuse // empty' $R)
            if [ -n "$U" ]; then
              python3 r2.py get "work/$ID/$U/voice-all.tgz" voice-all.tgz && cd w/$P && tar -xzf $GITHUB_WORKSPACE/voice-all.tgz
            else
            pip install -q soundfile numpy && sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
            mkdir te
            for RR in $(jq -r '.te_from // empty' $R) $RUN; do   # earlier run's voice first, then this run's re-voiced lines on top
              for k in $(python3 r2.py list "work/$ID/$RR/te/" | awk '{print $3}'); do python3 r2.py get "$k" t.tgz && tar -xzf t.tgz -C te; done
            done
            cd w/$P
            python3 tools/te_timeline.py build $GITHUB_WORKSPACE/te
            python3 tools/amp.py public/voice_te.wav src/ep/amp_te.json
            [ -f src/ep/amp_en.json ] || echo '[0]' > src/ep/amp_en.json
            tar -czf $GITHUB_WORKSPACE/voice-all.tgz public/voice_te.wav src/ep/timings_te.json src/ep/amp_te.json src/ep/amp_en.json
            fi
            npm ci --no-audit --no-fund --silent
            FR=$(npx remotion compositions src/index.tsx 2>/dev/null | awk -v c="$(jq -r .comp $R)" '$1==c {print $4}')
            echo "frames $FR"; cd $GITHUB_WORKSPACE
            python3 r2.py put voice-all.tgz "work/$ID/$RUN/voice-all.tgz"
            N=$(jq -r '.chunks // 12' $R)
            echo "ranges=$(python3 -c "import json;f=int('$FR');n=$N;s=-(-f//n);print(json.dumps([f'{a}-{min(f,a+s)-1}' for a in range(0,f,s)]))")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LID=$(basename "$(jq -r .lesson $R)" .ts); V=w/public/voice/$L; mkdir -p $V/$LID
          U=$(jq -r '.reuse // empty' $R)
          if [ -n "$U" ]; then   # Journal (4 Nov 2026): the voice of an earlier run of this video, pictures made again
            python3 r2.py get "work/$ID/$U/voice-all.tgz" v.tgz && tar -xzf v.tgz -C w/public/voice
            [ -s $V/$LID/durations.json ] && [ "$(jq length $V/$LID/durations.json)" -gt 0 ] || { echo "::error::no voice in run $U"; exit 1; }
          elif [ "$(jq -r '.voice_tar // empty' $R)" != "" ]; then
            python3 r2.py get "$(jq -r .voice_tar $R)" v.tgz && tar -xzf v.tgz -C $V/$LID
            # "voice_patch": "voice/x.tgz" — a few re-voiced <scene>_<i>.wav laid over the voice above (one bad Telugu line
            # re-made without re-voicing the rest); durations.json is rebuilt from the wavs (1 Nov 2026)
            if [ "$(jq -r '.voice_patch // empty' $R)" != "" ]; then
              pip install -q soundfile
              python3 r2.py get "$(jq -r .voice_patch $R)" p.tgz && tar -xzf p.tgz -C $V/$LID
              (cd w && npm ci --no-audit --no-fund --silent && node tools/export_sentences.mjs "$(jq -r .lesson $R)" "$(jq -r .spec $R)" "$L" ../sentences.json)
              python3 w/tools/durations.py sentences.json $V/$LID
            fi
          elif [ -n "$(jq -r '.colab_voice // empty' $R)" ]; then   # voice made on Colab
            pip install -q soundfile
            python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
            python3 r2.py get "$(jq -r .colab_voice $R)" t.tgz && tar -xzf t.tgz -C $V/$LID
            python3 w/tools/durations.py sentences.json $V/$LID
          elif [ "$L" = "te" ] || [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ]; then
            pip install -q soundfile
            python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
            for RR in $(jq -r '.te_from // empty' $R) $RUN; do   # earlier run's voice first, then this run's re-voiced lines on top
              for k in $(python3 r2.py list "work/$ID/$RR/te/" | awk '{print $3}'); do python3 r2.py get "$k" t.tgz && tar -xzf t.tgz -C $V/$LID; done
            done
            python3 w/tools/durations.py sentences.json $V/$LID
          else
            python3 r2.py get "work/$ID/$RUN/en-voice.tgz" v.tgz && tar -xzf v.tgz -C $V
          fi
          if [ -n "$(jq -r '.tempo // empty' $R)" ]; then   # 6 Nov 2026 (marketing videos): speak faster, same pitch
            pip install -q soundfile numpy
            command -v ffmpeg >/dev/null || { timeout 300 sudo apt-get -qq update; timeout 300 sudo apt-get -qq install -y ffmpeg >/dev/null; }
            python3 factory/tempo.py $V/$LID "$(jq -r .tempo $R)"
          fi
          if [ "$(jq -r '.en_voice // empty' $R)" = "chijobha" ] || [ "$(jq -r '.pace // false' $R)" = "true" ]; then   # 6 Nov 2026: his approved sample-G pauses (factory/pace.py)
            pip install -q soundfile numpy
            [ -s sentences.json ] || python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
            python3 factory/pace.py sentences.json $V/$LID
          fi
          [ "$(jq length $V/$LID/durations.json)" -gt 0 ] || { echo "::error::no voice for $LID"; exit 1; }   # never render a silent video
          tar -czf voice-all.tgz -C w/public/voice .
          python3 r2.py put voice-all.tgz "work/$ID/$RUN/voice-all.tgz"
          echo "ranges=$(python3 w/tools/ci_plan.py $V/$LID/durations.json $(jq -r '.chunks // 12' $R) | jq -c .ranges)" >> "$GITHUB_OUTPUT"

  chunk:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}   # tevoice may be skipped (English); don't let that skip us
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJson(needs.plan.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - name: Project + voice
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/voice-all.tgz" v.tgz
          [ -n "$(jq -r '.proj // empty' $R)" ] || { mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice; }
          # factory lessons: each picture element appears when its own words are spoken (4 Nov 2026, factory/sync.py)
          L=$(jq -r '.lesson // empty' $R)
          case "$L" in src/lessons/auto/auto-*) sudo python3 -m pip install -q --break-system-packages num2words >/dev/null 2>&1
            python3 factory/sync.py "w/src/lessons/auto/$(basename $L .ts | sed 's/^auto-//').json";; esac
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Render frames ${{ matrix.range }}
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); P=$(jq -r '.proj // empty' $R)
          if [ -n "$P" ]; then
            U=$(jq -r '.reuse // empty' $R); C="chunk-${{ matrix.range }}.mp4"
            if [ -n "$U" ] && python3 r2.py get "work/$ID/$U/chunks/$C" "$C" 2>/dev/null; then
              python3 r2.py put "$C" "work/$ID/${{ github.run_id }}/chunks/$C"; echo "reused $C from run $U"; exit 0
            fi
            cd w/$P && tar -xzf $GITHUB_WORKSPACE/v.tgz
            (cd public/fonts && bash get_fonts.sh >/dev/null) && npm ci --no-audit --no-fund --silent
            npx remotion render src/index.tsx "$(jq -r .comp $R)" "chunk-${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --muted --codec=h264 --crf=18 --concurrency=100% --log=error
            python3 $GITHUB_WORKSPACE/r2.py put "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks/chunk-${{ matrix.range }}.mp4"
            bash $GITHUB_WORKSPACE/finalize_piece.sh "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks"
            exit 0
          fi
          cd w && npm ci --no-audit --no-fund --silent
          npx remotion render src/index.ts "$(jq -r .comp $R)" "chunk-${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --muted --codec=h264 --crf=18 --concurrency=100% --log=error
          python3 $GITHUB_WORKSPACE/r2.py put "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks/chunk-${{ matrix.range }}.mp4"
          bash $GITHUB_WORKSPACE/finalize_piece.sh "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks"

  qa:        # screen checks on the FINAL timeline, run beside the picture pieces (CLAUDE.md rules 3-4; 4 Nov 2026 for every part):
             # qa_layout (fill, notes column), qa_timeline (empty / overlap / off-page), qa_sentences (2 stills per sentence +
             # text check: off-picture, spilling out of a board, written over, too small). A failure keeps the video out of the app.
    needs: [prep, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJson(needs.prep.outputs.req).proj == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - name: Project + voice
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/voice-all.tgz" v.tgz
          mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice
          sudo python3 -m pip install -q --break-system-packages num2words numpy pillow
          L=$(jq -r '.lesson // empty' $R)
          case "$L" in src/lessons/auto/auto-*) python3 factory/sync.py "w/src/lessons/auto/$(basename $L .ts | sed 's/^auto-//').json";; esac
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Layout, timeline, every sentence
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); L=$(jq -r '.lang // "en"' $R); COMP=$(jq -r .comp $R)
          LID=$(basename "$(jq -r .lesson $R)" .ts); D=public/voice/$L/$LID/durations.json
          cd w && npm ci --no-audit --no-fund --silent
          set +e
          # picture-voice timing (5 Nov 2026): no element shows before the sentence that says it
          z=0; case "$(jq -r .lesson $R)" in src/lessons/auto/auto-*)
            python3 $GITHUB_WORKSPACE/factory/sync.py --check "src/lessons/auto/$(basename "$(jq -r .lesson $R)" .ts | sed 's/^auto-//').json" > sync.txt 2>&1; z=$?
            echo "::notice title=timing::$(grep -c EARLY sync.txt) elements shown before their words";; esac
          python3 tools/qa_layout.py $D $COMP $RUNNER_TEMP/lay > lay.txt 2>&1; a=$?
          QA_LANG=$L QA_TMP=$RUNNER_TEMP python3 tools/qa_timeline.py "$(jq -r .lesson $R)" "$(jq -r .spec $R)" $D > tl.txt 2>&1; b=$?
          python3 tools/qa_sentences.py $D $COMP $RUNNER_TEMP/sen > sen.txt 2>&1; c=$?
          set -e
          echo "::notice title=layout::$(tail -1 lay.txt)"; echo "::notice title=timeline::$(tail -1 tl.txt) ($(grep -c . tl.txt) lines)"; echo "::notice title=sentences::$(tail -1 sen.txt)"
          cat lay.txt tl.txt sen.txt $( [ -f sync.txt ] && echo sync.txt ) > qa-report.txt
          python3 $GITHUB_WORKSPACE/r2.py put qa-report.txt "work/$ID/${{ github.run_id }}/qa/report.txt"
          for f in $RUNNER_TEMP/sen/sheet-*.png $RUNNER_TEMP/sen/text-check.json; do [ -f "$f" ] || continue; python3 $GITHUB_WORKSPACE/r2.py put "$f" "work/$ID/${{ github.run_id }}/qa/$(basename $f)"; done
          echo "{\"layout\":$a,\"timeline\":$b,\"sentences\":$c,\"timing\":$z}" > qa.json; python3 $GITHUB_WORKSPACE/r2.py put qa.json "work/$ID/${{ github.run_id }}/qa/result.json"
          [ $a = 0 ] && [ $b = 0 ] && [ $c = 0 ] && [ $z = 0 ]

  audio:     # the sound track is rendered at the same time as the picture pieces (was done after them in finish)
    needs: [prep, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJson(needs.prep.outputs.req).proj == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - name: Project + voice
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/voice-all.tgz" v.tgz
          mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Render sound track
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R)
          cd w && npm ci --no-audit --no-fund --silent
          npx remotion render src/index.ts "$(jq -r .comp $R)" audio.wav --codec=wav --log=error
          python3 $GITHUB_WORKSPACE/r2.py put audio.wav "work/$ID/${{ github.run_id }}/audio.wav"

  finish:
    needs: [plan, chunk, audio, qa]
    if: ${{ !cancelled() && needs.chunk.result == 'success' && needs.audio.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5 Nov 2026: voice check of a 71-min video needs >2 h on CPU
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - name: Project + voice + pieces
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/$RUN/voice-all.tgz" v.tgz
          [ -n "$(jq -r '.proj // empty' $R)" ] || { mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice; }
          mkdir -p w/chunks; for k in $(python3 r2.py list "work/$ID/$RUN/chunks/" | awk '{print $3}'); do python3 r2.py get "$k" "w/chunks/$(basename $k)"; done
          WANT=$(echo '${{ needs.plan.outputs.ranges }}' | jq length); GOT=$(ls w/chunks/chunk-*.mp4 | wc -l)
          [ "$GOT" = "$WANT" ] || { echo "pieces: got $GOT of $WANT"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Audio, join, master, deliver
        run: |
          exec > >(tee -a "$RUNNER_TEMP/finish.log") 2>&1; set -x
          trap 'tail -c 6000 "$RUNNER_TEMP/finish.log" > "$RUNNER_TEMP/tail.txt"; python3 $GITHUB_WORKSPACE/r2.py put "$RUNNER_TEMP/tail.txt" "work/$(jq -r .video_id $GITHUB_WORKSPACE/queue/request.json)/$GITHUB_RUN_ID/finish-log.txt"' ERR
          R=$PWD/queue/request.json; COMP=$(jq -r .comp $R); ID=$(jq -r .video_id $R); CH=$(jq -r .chapter_id $R); L=$(jq -r '.lang // "en"' $R)
          P=$(jq -r '.proj // empty' $R)
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          if [ -n "$P" ]; then
            mv w/chunks w/$P/chunks; cd w/$P; tar -xzf $GITHUB_WORKSPACE/v.tgz
            cp public/voice_$L.wav audio.wav; cp src/ep/timings_$L.json durations.json
          else
          cd w
          if ! python3 $GITHUB_WORKSPACE/r2.py get "work/$ID/$GITHUB_RUN_ID/audio.wav" audio.wav 2>/dev/null; then
            npm ci --no-audit --no-fund --silent
            npx remotion render src/index.ts "$COMP" audio.wav --codec=wav --log=error
          fi
          cp public/voice/$L/$(basename "$(jq -r .lesson $R)" .ts)/durations.json durations.json
          fi
          WANT=$(echo '${{ needs.plan.outputs.ranges }}' | jq length)
          if [ "$(ls chunks/hd-*.mp4 2>/dev/null | wc -l)" = "$WANT" ] && [ "$(ls chunks/sd-*.mp4 2>/dev/null | wc -l)" = "$WANT" ]; then
            # fast path (1 Nov 2026): pictures were already encoded by the 16 chunk machines — join only, master the audio once
            ffmpeg -v error -y -i audio.wav -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k a_hd.m4a
            ffmpeg -v error -y -i audio.wav -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -ac 1 -c:a aac -b:a 96k a_sd.m4a
            for Q in hd sd; do
              ls chunks/$Q-chunk-*.mp4 | sort -t- -k3 -n | sed "s|^|file '$PWD/|; s|$|'|" > list_$Q.txt
              ffmpeg -v error -y -f concat -safe 0 -i list_$Q.txt -c copy v_$Q.mp4
              ffmpeg -v error -y -i v_$Q.mp4 -i a_$Q.m4a -map 0:v -map 1:a -shortest -c copy -movflags +faststart $Q.mp4
            done
          else
          ls chunks/chunk-*.mp4 | sort -t- -k2 -n | sed "s|^|file '$PWD/|; s|$|'|" > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy video.mp4
          ffmpeg -v error -y -i video.mp4 -i audio.wav -map 0:v -map 1:a -shortest -c:v libx264 -preset medium -tune animation -crf 22 -maxrate 3M -bufsize 6M -pix_fmt yuv420p -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k -movflags +faststart hd.mp4
          ffmpeg -v error -y -i hd.mp4 -vf scale=-2:480 -c:v libx264 -preset veryfast -crf 26 -profile:v main -pix_fmt yuv420p -c:a aac -b:a 96k -ac 1 -movflags +faststart sd.mp4
          fi
          python3 $GITHUB_WORKSPACE/r2.py put hd.mp4 "$CH/$ID-hd.mp4"
          python3 $GITHUB_WORKSPACE/r2.py put sd.mp4 "$CH/$ID-sd.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 hd.mp4)
          jq -n --arg d "$DUR" --arg run "$GITHUB_RUN_ID" --arg hd "$(stat -c%s hd.mp4)" --arg sd "$(stat -c%s sd.mp4)" \
            --slurpfile dur durations.json \
            '{state:"done", runner:"public", duration:($d|tonumber), hd_bytes:($hd|tonumber), sd_bytes:($sd|tonumber), run:$run, durations:$dur[0], at:(now|todate)}' > s.json
          python3 $GITHUB_WORKSPACE/r2.py put s.json "jobs/$ID.json"
          [ -n "$P" ] && exit 0
          # ---- Journal videos (4 Nov 2026): the voice checks run HERE, on this run's own sound track and the exact sentences this
          # run voiced (work/<id>/<run>/sentences.json), BEFORE anything reaches the app. English: qa_final (whole video) must hear
          # every sentence; per-sentence check reported too. Telugu: per-sentence check, every sentence >= 0.6.
          set +x; set +e
          python3 $GITHUB_WORKSPACE/r2.py get "work/$ID/$GITHUB_RUN_ID/sentences.json" sentences.json || \
            python3 $GITHUB_WORKSPACE/r2.py get "work/$ID/$(jq -r '.reuse // .te_from // empty' $R)/sentences.json" sentences.json   # voice reused from that run
          pip install -q faster-whisper numpy >/dev/null
          # 6 Nov 2026: English decides on qa_final alone, so the second full listen (per sentence, ~12 min on CPU) is Telugu only
          PS=0; : > ps.txt
          if [ "$L" != "en" ]; then
            python3 $GITHUB_WORKSPACE/check_te.py audio.wav sentences.json durations.json "$L" per_sentence.json > ps.txt; PS=$?
            python3 $GITHUB_WORKSPACE/r2.py put per_sentence.json "work/$ID/$GITHUB_RUN_ID/per_sentence.json"
          fi
          QF=0
          if [ "$L" = "en" ]; then
            python3 tools/qa_final.py audio.wav sentences.json en report.md > /dev/null; QF=$?
            python3 $GITHUB_WORKSPACE/r2.py put report.md "work/$ID/$GITHUB_RUN_ID/qa_final.md"
            echo "::notice title=qa_final::$(sed -n 2p report.md)"
            grep -o "MISSING/GARBLED [^ ]* (match [0-9.]*)" report.md | head -10 | while read -r l; do echo "::warning title=qa_final::$l"; done
            VOICE=$QF
          else VOICE=$PS; fi
          while read -r l; do echo "::notice title=per-sentence::$l"; done < ps.txt
          QA="${{ needs.qa.result }}"
          set -e
          if [ "$VOICE" != 0 ] || [ "$QA" != success ]; then
            jq --arg why "voice check $VOICE · screen checks $QA" '.state = "blocked" | .why = $why' s.json > s2.json && mv s2.json s.json
            python3 $GITHUB_WORKSPACE/r2.py put s.json "jobs/$ID.json"
            echo "::error title=blocked::$ID not sent to the app — voice check $VOICE, screen checks $QA (reports in work/$ID/$GITHUB_RUN_ID/)"
            exit 1
          fi
          # video factory: a request with a title becomes a DRAFT row in the app's Video tab (CHIJOBHA publishes)
          if [ -n "$(jq -r '.title // empty' $R)" ]; then
            python3 $GITHUB_WORKSPACE/r2.py draft "$(jq -c --arg d "$DUR" '{id: .video_id, chapter_id, part: (.part // 1), title, lang: (.lang // "en"), duration_sec: ($d|tonumber)}' $R)"
          fi
      - name: Final voice check (sub-project mode) — every script sentence must be heard
        run: |
          R=$PWD/queue/request.json; P=$(jq -r '.proj // empty' $R); L=$(jq -r '.lang // "en"' $R)
          [ -n "$P" ] || exit 0
          cd w/$P && pip install -q faster-whisper numpy
          python3 tools/te_timeline.py sentences sentences.json
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 hd.mp4)
          B=$(ffmpeg -v info -i hd.mp4 -vf "blackdetect=d=1.0:pix_th=0.10" -an -f null - 2>&1 | grep -c black_start || true)
          echo "::notice title=video::duration ${D}s · black stretches over 1s: ${B}"
          set +e
          if [ -f tools/qa_sentences_te.py ] && [ "$L" = "te" ]; then
            python3 tools/qa_sentences_te.py hd.mp4 per_sentence.json > ps.txt; rs=$?
            while read -r l; do echo "::notice title=per-sentence::$l"; done < ps.txt
          fi
          # qa_final (one long transcription) drifts on 19-min Telugu (30-53/138 while per-sentence gives 135/138): Telugu
          # sub-projects use the per-sentence check only, which halves the time (1 Nov 2026).
          if [ -n "${rs:-}" ]; then printf 'skipped\nper-sentence check used for Telugu\n' > report.md; rc=$rs
          else python3 $GITHUB_WORKSPACE/w/tools/qa_final.py hd.mp4 sentences.json "$L" report.md > /dev/null; rc=$?; fi
          set -e
          echo "::notice title=voice::$(sed -n 2p report.md)"
          grep -o "MISSING/GARBLED [^ ]* (match [0-9.]*)" report.md | head -5 | while read -r l; do echo "::warning title=voice::$l"; done || true
          exit ${rs:-$rc}
      - name: Remove work files older than 7 days
        run: |
          CUT=$(date -u -d '7 days ago' +%F)
          python3 r2.py list work/ | awk -v c="$CUT" '$1<c && $3 !~ /^work\/factory\// {print $3}' | while read k; do python3 r2.py rm "$k"; done

  report-failure:
    needs: [prep, tevoice, plan, chunk, finish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request (factory input)
        if: ${{ inputs.req != '' && inputs.req != null }}
        env: { REQ: "${{ inputs.req }}" }
        run: |   # app chapter ids are two-digit (ce-en-ch01): ids from the factory are normalised here, for every job alike
          printf '%s' "$REQ" | jq -c 'def two: sub("-ch(?<n>[0-9])(?<r>-|$)"; "-ch0\(.n)\(.r)"); .chapter_id |= two | .video_id |= two' > queue/request.json
      - run: |
          ID=$(jq -r .video_id queue/request.json)
          echo "{\"state\":\"failed\",\"runner\":\"public\",\"run\":\"$GITHUB_RUN_ID\",\"at\":\"$(date -u +%FT%TZ)\"}" > s.json
          python3 r2.py put s.json "jobs/$ID.json" || true

  next:      # 6 Nov 2026: when a render ends (any result), the re-voice queue starts the next chosen part at once
    needs: [finish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/revoice.yml/dispatches" -f ref=main || true
