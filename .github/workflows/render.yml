# Public render runner (free, unlimited minutes for public repos). Contains NO course content.
# Trigger: Claude pushes queue/request.json (commit message = video id). The private project arrives as a tarball
# from private storage (src/<sha>.tgz); voice + pieces pass through private storage work/<video_id>/<run_id>/
# (kept 7 days so one bad piece can be re-made). No GitHub artifacts. Newest request for a video cancels older runs.
# request.json: { "video_id", "chapter_id", "src": "src/<sha>.tgz", "lesson": "src/lessons/jr-x.ts", "spec": "jrXSpec",
#   "comp": "JrXEN", "lang": "en"|"te", "chunks": 12, "voice_tar": "voice/x.tgz" (optional), "te_shards": 16 (optional) }
# Sub-project mode (Bit Badi Vox engine): "proj": "channels/bitbadi/vox-en" (+ "comp": "EpTE", "lang": "te"). The project
#   folder has its own package.json (entry src/index.tsx); sentences come from proj tools/te_timeline.py; the joined voice +
#   timings + Bit's mouth data are built in `plan` and passed to the pieces.
# "reuse": "<run_id>" — take that earlier run's voice (voice-all.tgz) and finished pieces instead of making them again
#   (e.g. only the last step failed). Pieces missing there are rendered as usual.
name: render
run-name: ${{ github.event.head_commit.message || 'render (manual)' }}
on:
  push:
    branches: [main]
    paths: ['queue/request.json']
  workflow_dispatch:

concurrency: { group: "render-${{ github.sha }}", cancel-in-progress: false }
permissions: { contents: read, actions: write, id-token: write }

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      req: ${{ steps.req.outputs.req }}
      shards: ${{ steps.voice.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: req
        run: echo "req=$(jq -c . queue/request.json)" >> "$GITHUB_OUTPUT"
      - name: No double runs — cancel older runs of the same video
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ID=$(jq -r .video_id queue/request.json)
          for st in queued in_progress; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/render.yml/runs?status=$st&per_page=50" -q '.workflow_runs[]|"\(.id) \(.head_sha)"'
          done | while read rid sha; do
            [ "$rid" -lt "$GITHUB_RUN_ID" ] || continue
            other=$(gh api "repos/$GITHUB_REPOSITORY/contents/queue/request.json?ref=$sha" -q .content | base64 -d | jq -r .video_id)
            [ "$other" = "$ID" ] && { echo "cancel older run $rid"; gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$rid/cancel" || true; }
          done
      - name: Status → started
        run: |
          ID=$(jq -r .video_id queue/request.json)
          echo "{\"state\":\"started\",\"runner\":\"public\",\"run\":\"$GITHUB_RUN_ID\",\"at\":\"$(date -u +%FT%TZ)\"}" > s.json
          python3 r2.py put s.json "jobs/$ID.json"
      - name: Private project
        run: python3 r2.py get "$(jq -r .src queue/request.json)" src.tgz && mkdir w && tar -xzf src.tgz -C w
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: w/package-lock.json }
      - id: voice
        name: Voice plan
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); L=$(jq -r '.lang // "en"' $R)
          cd w
          if [ "$(jq -r '.voice_tar // empty' $R)" != "" ]; then echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          P=$(jq -r '.proj // empty' $R)
          if [ -n "$(jq -r '.reuse // empty' $R)" ]; then echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$P" ]; then
            python3 $P/tools/te_timeline.py sentences sentences.json
            python3 $GITHUB_WORKSPACE/r2.py put sentences.json "work/$ID/$GITHUB_RUN_ID/sentences.json"
            N=$(jq -r '.te_shards // 16' $R); echo "shards=$(jq -nc "[range($N)]")" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm ci --no-audit --no-fund --silent
          node tools/export_sentences.mjs "$(jq -r .lesson $R)" "$(jq -r .spec $R)" "$L" sentences.json
          python3 $GITHUB_WORKSPACE/r2.py put sentences.json "work/$ID/$GITHUB_RUN_ID/sentences.json"
          if [ "$L" = "te" ]; then
            N=$(jq -r '.te_shards // 16' $R); echo "shards=$(jq -nc "[range($N)]")" >> "$GITHUB_OUTPUT"
          else
            pip install -q kokoro-onnx soundfile wordfreq
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg espeak-ng >/dev/null
            KOKORO_DIR=$HOME/kokoro-model bash tools/setup_kokoro.sh
            KOKORO_DIR=$HOME/kokoro-model OUT=$RUNNER_TEMP bash tools/chapter.sh voice "$(jq -r .lesson $R)" "$(jq -r .spec $R)" "$(jq -r .comp $R)" "$(jq -r '.voice // "roki-in50"' $R)"
            tar -czf en-voice.tgz -C public/voice/en .
            python3 $GITHUB_WORKSPACE/r2.py put en-voice.tgz "work/$ID/$GITHUB_RUN_ID/en-voice.tgz"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          fi

  tegpu:     # Telugu voice on a free Kaggle GPU first (~2-5 min); if anything fails, tevoice (16 CPU machines) takes over
    needs: prep
    if: ${{ needs.prep.outputs.shards != '[]' && needs.prep.outputs.shards != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ok: ${{ steps.k.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ] || { echo "no Kaggle secrets - using CPU machines"; exit 0; }
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
          pip install -q kaggle
          python3 kaggle_voice.py w sentences.json te-gpu.tgz "te-voice-$ID"
          python3 r2.py put te-gpu.tgz "work/$ID/$RUN/te/te-gpu.tgz"
          echo "ok=true" >> "$GITHUB_OUTPUT"

  tevoice:   # Telugu in CHIJOBHA's copied voice, split over many machines (fallback when the Kaggle GPU is unavailable)
    needs: [prep, tegpu]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.shards != '[]' && needs.prep.outputs.shards != '' && needs.tegpu.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one machine's hiccup must not stop the other 15; re-run only the failed shard
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Telugu voice shard ${{ matrix.shard }}
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); N=$(jq -r '.te_shards // 16' $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/sentences.json" sentences.json
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          sleep $(( ${{ matrix.shard }} * 4 ))   # stagger the 1.4 GB model downloads
          bash w/tools/setup_indicf5.sh 2>&1 | tail -3
          SHARD="${{ matrix.shard }}/$N" python3 w/tools/voice_te.py sentences.json te-out > /dev/null
          tar -czf te-${{ matrix.shard }}.tgz -C te-out .
          python3 r2.py put te-${{ matrix.shard }}.tgz "work/$ID/${{ github.run_id }}/te/te-${{ matrix.shard }}.tgz"

  plan:
    needs: [prep, tegpu, tevoice]
    if: ${{ always() && needs.prep.result == 'success' && (needs.tegpu.outputs.ok == 'true' || needs.tevoice.result == 'success' || (needs.tevoice.result == 'skipped' && needs.prep.outputs.shards == '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ranges: ${{ steps.plan.outputs.ranges }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); L=$(jq -r '.lang // "en"' $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          P=$(jq -r '.proj // empty' $R)
          if [ -n "$P" ]; then
            U=$(jq -r '.reuse // empty' $R)
            if [ -n "$U" ]; then
              python3 r2.py get "work/$ID/$U/voice-all.tgz" voice-all.tgz && cd w/$P && tar -xzf $GITHUB_WORKSPACE/voice-all.tgz
            else
            pip install -q soundfile numpy && sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
            mkdir te; for k in $(python3 r2.py list "work/$ID/$RUN/te/" | awk '{print $3}'); do python3 r2.py get "$k" t.tgz && tar -xzf t.tgz -C te; done
            cd w/$P
            python3 tools/te_timeline.py build $GITHUB_WORKSPACE/te
            python3 tools/amp.py public/voice_te.wav src/ep/amp_te.json
            [ -f src/ep/amp_en.json ] || echo '[0]' > src/ep/amp_en.json
            tar -czf $GITHUB_WORKSPACE/voice-all.tgz public/voice_te.wav src/ep/timings_te.json src/ep/amp_te.json src/ep/amp_en.json
            fi
            npm ci --no-audit --no-fund --silent
            FR=$(npx remotion compositions src/index.tsx 2>/dev/null | awk -v c="$(jq -r .comp $R)" '$1==c {print $4}')
            echo "frames $FR"; cd $GITHUB_WORKSPACE
            python3 r2.py put voice-all.tgz "work/$ID/$RUN/voice-all.tgz"
            N=$(jq -r '.chunks // 12' $R)
            echo "ranges=$(python3 -c "import json;f=int('$FR');n=$N;s=-(-f//n);print(json.dumps([f'{a}-{min(f,a+s)-1}' for a in range(0,f,s)]))")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LID=$(basename "$(jq -r .lesson $R)" .ts); V=w/public/voice/$L; mkdir -p $V/$LID
          if [ "$(jq -r '.voice_tar // empty' $R)" != "" ]; then
            python3 r2.py get "$(jq -r .voice_tar $R)" v.tgz && tar -xzf v.tgz -C $V/$LID
          elif [ "$L" = "te" ]; then
            pip install -q soundfile
            python3 r2.py get "work/$ID/$RUN/sentences.json" sentences.json
            for k in $(python3 r2.py list "work/$ID/$RUN/te/" | awk '{print $3}'); do python3 r2.py get "$k" t.tgz && tar -xzf t.tgz -C $V/$LID; done
            python3 w/tools/durations.py sentences.json $V/$LID
          else
            python3 r2.py get "work/$ID/$RUN/en-voice.tgz" v.tgz && tar -xzf v.tgz -C $V
          fi
          tar -czf voice-all.tgz -C w/public/voice .
          python3 r2.py put voice-all.tgz "work/$ID/$RUN/voice-all.tgz"
          echo "ranges=$(python3 w/tools/ci_plan.py $V/$LID/durations.json $(jq -r '.chunks // 12' $R) | jq -c .ranges)" >> "$GITHUB_OUTPUT"

  chunk:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}   # tevoice may be skipped (English); don't let that skip us
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJson(needs.plan.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - name: Project + voice
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R)
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/${{ github.run_id }}/voice-all.tgz" v.tgz
          [ -n "$(jq -r '.proj // empty' $R)" ] || { mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Render frames ${{ matrix.range }}
        run: |
          R=$PWD/queue/request.json; ID=$(jq -r .video_id $R); P=$(jq -r '.proj // empty' $R)
          if [ -n "$P" ]; then
            U=$(jq -r '.reuse // empty' $R); C="chunk-${{ matrix.range }}.mp4"
            if [ -n "$U" ] && python3 r2.py get "work/$ID/$U/chunks/$C" "$C" 2>/dev/null; then
              python3 r2.py put "$C" "work/$ID/${{ github.run_id }}/chunks/$C"; echo "reused $C from run $U"; exit 0
            fi
            cd w/$P && tar -xzf $GITHUB_WORKSPACE/v.tgz
            (cd public/fonts && bash get_fonts.sh >/dev/null) && npm ci --no-audit --no-fund --silent
            npx remotion render src/index.tsx "$(jq -r .comp $R)" "chunk-${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --muted --codec=h264 --crf=18 --concurrency=100% --log=error
            python3 $GITHUB_WORKSPACE/r2.py put "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks/chunk-${{ matrix.range }}.mp4"
            exit 0
          fi
          cd w && npm ci --no-audit --no-fund --silent
          npx remotion render src/index.ts "$(jq -r .comp $R)" "chunk-${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --muted --codec=h264 --crf=18 --concurrency=100% --log=error
          python3 $GITHUB_WORKSPACE/r2.py put "chunk-${{ matrix.range }}.mp4" "work/$ID/${{ github.run_id }}/chunks/chunk-${{ matrix.range }}.mp4"

  finish:
    needs: [plan, chunk]
    if: ${{ !cancelled() && needs.chunk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Project + voice + pieces
        run: |
          R=queue/request.json; ID=$(jq -r .video_id $R); RUN=${{ github.run_id }}
          python3 r2.py get "$(jq -r .src $R)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          python3 r2.py get "work/$ID/$RUN/voice-all.tgz" v.tgz
          [ -n "$(jq -r '.proj // empty' $R)" ] || { mkdir -p w/public/voice && tar -xzf v.tgz -C w/public/voice; }
          mkdir -p w/chunks; for k in $(python3 r2.py list "work/$ID/$RUN/chunks/" | awk '{print $3}'); do python3 r2.py get "$k" "w/chunks/$(basename $k)"; done
          WANT=$(echo '${{ needs.plan.outputs.ranges }}' | jq length); GOT=$(ls w/chunks/*.mp4 | wc -l)
          [ "$GOT" = "$WANT" ] || { echo "pieces: got $GOT of $WANT"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Audio, join, master, deliver
        run: |
          exec > >(tee -a "$RUNNER_TEMP/finish.log") 2>&1; set -x
          trap 'tail -c 6000 "$RUNNER_TEMP/finish.log" > "$RUNNER_TEMP/tail.txt"; python3 $GITHUB_WORKSPACE/r2.py put "$RUNNER_TEMP/tail.txt" "work/$(jq -r .video_id $GITHUB_WORKSPACE/queue/request.json)/$GITHUB_RUN_ID/finish-log.txt"' ERR
          R=$PWD/queue/request.json; COMP=$(jq -r .comp $R); ID=$(jq -r .video_id $R); CH=$(jq -r .chapter_id $R); L=$(jq -r '.lang // "en"' $R)
          P=$(jq -r '.proj // empty' $R)
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          if [ -n "$P" ]; then
            mv w/chunks w/$P/chunks; cd w/$P; tar -xzf $GITHUB_WORKSPACE/v.tgz
            cp public/voice_$L.wav audio.wav; cp src/ep/timings_$L.json durations.json
          else
          cd w && npm ci --no-audit --no-fund --silent
          npx remotion render src/index.ts "$COMP" audio.wav --codec=wav --log=error
          cp public/voice/$L/$(basename "$(jq -r .lesson $R)" .ts)/durations.json durations.json
          fi
          ls chunks/*.mp4 | sort -t- -k2 -n | sed "s|^|file '$PWD/|; s|$|'|" > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy video.mp4
          ffmpeg -v error -y -i video.mp4 -i audio.wav -map 0:v -map 1:a -shortest -c:v libx264 -preset medium -tune animation -crf 22 -maxrate 3M -bufsize 6M -pix_fmt yuv420p -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k -movflags +faststart hd.mp4
          ffmpeg -v error -y -i hd.mp4 -vf scale=-2:480 -c:v libx264 -preset veryfast -crf 26 -profile:v main -pix_fmt yuv420p -c:a aac -b:a 96k -ac 1 -movflags +faststart sd.mp4
          python3 $GITHUB_WORKSPACE/r2.py put hd.mp4 "$CH/$ID-hd.mp4"
          python3 $GITHUB_WORKSPACE/r2.py put sd.mp4 "$CH/$ID-sd.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 hd.mp4)
          jq -n --arg d "$DUR" --arg run "$GITHUB_RUN_ID" --arg hd "$(stat -c%s hd.mp4)" --arg sd "$(stat -c%s sd.mp4)" \
            --slurpfile dur durations.json \
            '{state:"done", runner:"public", duration:($d|tonumber), hd_bytes:($hd|tonumber), sd_bytes:($sd|tonumber), run:$run, durations:$dur[0], at:(now|todate)}' > s.json
          python3 $GITHUB_WORKSPACE/r2.py put s.json "jobs/$ID.json"
      - name: Remove work files older than 7 days
        run: |
          CUT=$(date -u -d '7 days ago' +%F)
          python3 r2.py list work/ | awk -v c="$CUT" '$1<c {print $3}' | while read k; do python3 r2.py rm "$k"; done

  report-failure:
    needs: [prep, tevoice, plan, chunk, finish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ID=$(jq -r .video_id queue/request.json)
          echo "{\"state\":\"failed\",\"runner\":\"public\",\"run\":\"$GITHUB_RUN_ID\",\"at\":\"$(date -u +%FT%TZ)\"}" > s.json
          python3 r2.py put s.json "jobs/$ID.json" || true
