# Check which AI keys are saved and working (names only; values never printed). Run by hand.
name: keys
on: workflow_dispatch
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Saved secret names
        env: { ALL: "${{ toJSON(secrets) }}" }
        run: printf '%s' "$ALL" | jq -r 'keys[]' | grep -v github_token
      - name: Try each AI service
        env: { ALL: "${{ toJSON(secrets) }}" }
        run: |
          printf '%s' "$ALL" > /tmp/s.json
          python3 - <<'PY'
          import json, urllib.request, re
          S = json.load(open("/tmp/s.json"))
          def find(*pat):
              for k, v in S.items():
                  if any(re.search(p, k, re.I) for p in pat): return k, v
              return None, None
          Q = ("Write two short spoken sentences a teacher would say about the APPSC exam, first in English, then the same "
               "idea in natural Telugu script. Return JSON {\"en\": \"...\", \"te\": \"...\"}.")
          def call(name, url, key, model, extra={}):
              body = {"model": model, "messages": [{"role": "user", "content": Q}], **extra}
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Authorization": f"Bearer {key}", "content-type": "application/json"})
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=120))
                  msg = r["choices"][0]["message"]["content"] if "choices" in r else json.dumps(r.get("completion_message", r))[:600]
                  print(f"OK  {name} {model}: {msg[:500]}\n    usage: {r.get('usage') or r.get('metrics')}")
              except urllib.error.HTTPError as e:
                  print(f"ERR {name} {model}: HTTP {e.code} {e.read()[:400]}")
              except Exception as e:
                  print(f"ERR {name} {model}: {e}")
          def models(name, url, key):
              try:
                  r = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"}), timeout=60))
                  ids = [m.get("id") for m in r.get("data", [])]
                  print(f"{name} models: {ids}"); return ids
              except Exception as e:
                  print(f"{name} models: error {e}"); return []
          k, v = find(r"deepseek")
          print("DeepSeek secret:", k)
          if v:
              ids = models("DeepSeek", "https://api.deepseek.com/models", v)
              for m in ids or ["deepseek-chat"]:
                  call("DeepSeek", "https://api.deepseek.com/chat/completions", v, m, {"response_format": {"type": "json_object"}})
          k, v = find(r"meta", r"llama")
          print("Meta secret:", k)
          if v:
              ids = models("Meta", "https://api.llama.com/v1/models", v)
              for m in (ids or ["Llama-4-Maverick-17B-128E-Instruct-FP8"])[:4]:
                  call("Meta", "https://api.llama.com/compat/v1/chat/completions", v, m)
          k, v = find(r"gemini")
          print("Gemini secret:", k)
          PY
