# One-off check that the Kaggle GPU voice works (3 Telugu lines). Trigger: push queue/kaggle-test.json {"src": "src/<sha>.tgz"}
name: kaggle-test
on:
  push:
    branches: [main]
    paths: ['queue/kaggle-test.json']
permissions: { contents: read, id-token: write }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$KAGGLE_USERNAME" ] && echo "username secret: set" || echo "username secret: MISSING"
          [ -n "$KAGGLE_KEY" ] && echo "key secret: set (${#KAGGLE_KEY} chars, starts ${KAGGLE_KEY:0:5}...)" | sed 's/starts .*/&/' || echo "key secret: MISSING"
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          python3 r2.py get "$(jq -r .src queue/kaggle-test.json)" src.tgz && mkdir w && tar -xzf src.tgz -C w
          cat > s.json <<'J'
          {"t1": ["నమస్కారం. ఇది కాగుల్ గ్రాఫిక్స్ కార్డు మీద చేసిన పరీక్ష.", "బిట్ బడి ఛానెల్‌కి స్వాగతం.", "అసలు ఇలాంటిది సాధ్యమేనా? అవును, సాధ్యమే."]}
          J
          pip install -q kaggle
          python3 kaggle_voice.py w s.json te-test.tgz te-voice-kaggle-test
          python3 r2.py put te-test.tgz work/kaggle-test/${{ github.run_id }}/te-test.tgz
