# Final voice checks on a FINISHED Journal video (its run's sound track) (Roach Academia), run on demand. Contains NO course content.
# The workspace that builds videos cannot download finished videos (storage is not reachable from it), so the final
# voice checks run here: tools/qa_final.py (whole video, EN) and check_te.py (each sentence cut and transcribed alone;
# the check for Telugu, also run for English). Results: notices on the run + reports in private storage
# work/<video_id>/check-<run_id>/. Separate from render.yml so a check never touches a render.
# Start: gh workflow run check.yml -R CHIJOOBHA/video-render -f video_id=… -f chapter_id=… -f src=src/<sha>.tgz
#        -f lesson=src/lessons/jr-x.ts -f spec=jrXSpec -f lang=en|te
name: check
run-name: check ${{ inputs.video_id }}
on:
  workflow_dispatch:
    inputs:
      video_id: { required: true, type: string }
      chapter_id: { required: true, type: string }
      src: { required: true, type: string }
      lesson: { required: true, type: string }
      spec: { required: true, type: string }
      lang: { required: true, type: string }
permissions: { contents: read, id-token: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Video, project, timings
        run: |
          python3 r2.py get "jobs/${{ inputs.video_id }}.json" job.json
          # the finished video folder is closed to this runner; the run's own sound track (the exact audio muxed into the video,
          # before loudness mastering) is in work/<id>/<run>/audio.wav and is all the voice checks need
          python3 r2.py get "work/${{ inputs.video_id }}/$(jq -r .run job.json)/audio.wav" audio.wav
          python3 r2.py get "${{ inputs.src }}" src.tgz && mkdir w && tar -xzf src.tgz -C w
          jq .durations job.json > durations.json
          (cd w && npm ci --no-audit --no-fund --silent && node tools/export_sentences.mjs "${{ inputs.lesson }}" "${{ inputs.spec }}" "${{ inputs.lang }}" ../sentences.json)
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          echo "::notice title=audio::sound track $(ffprobe -v error -show_entries format=duration -of csv=p=0 audio.wav)s (run $(jq -r .run job.json))"
      - name: Per-sentence voice check
        id: ps
        continue-on-error: true
        run: |
          set +e   # a failed check must still print and save its report (bash -e stopped here before)
          python3 check_te.py audio.wav sentences.json durations.json "${{ inputs.lang }}" per_sentence.json > ps.txt; rc=$?
          while read -r l; do echo "::notice title=per-sentence::$l"; done < ps.txt
          python3 r2.py put per_sentence.json "work/${{ inputs.video_id }}/check-$GITHUB_RUN_ID/per_sentence.json"
          exit $rc
      - name: Whole-video voice check (qa_final)
        id: qf
        continue-on-error: true
        run: |
          set +e
          python3 w/tools/qa_final.py audio.wav sentences.json "${{ inputs.lang }}" report.md > /dev/null; rc=$?
          echo "::notice title=qa_final::$(sed -n 2p report.md)"
          grep -o "MISSING/GARBLED [^ ]* (match [0-9.]*)" report.md | head -10 | while read -r l; do echo "::warning title=qa_final::$l"; done || true
          python3 r2.py put report.md "work/${{ inputs.video_id }}/check-$GITHUB_RUN_ID/qa_final.md"
          exit $rc
      - name: Result
        run: |
          echo "per-sentence: ${{ steps.ps.outcome }} · qa_final: ${{ steps.qf.outcome }}"
          if [ "${{ inputs.lang }}" = "te" ]; then [ "${{ steps.ps.outcome }}" = "success" ]; else [ "${{ steps.qf.outcome }}" = "success" ]; fi
