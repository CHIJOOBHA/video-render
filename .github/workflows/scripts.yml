# Roach Academia recording scripts (8 Nov 2026): N workers take chapters from the Supabase queue (video_scripts,
# edge function video-scripts, GitHub OIDC) and write EN + TE recording scripts with the Claude API. Contains NO course
# content and never prints notes. Starts on push of rscripts/**, by hand, and every hour until the queue is empty.
name: scripts
run-name: scripts ${{ github.event_name }}
on:
  # 8 Nov 2026 22:40 IST (CHIJOBHA): the API writes whenever it has credit; with no credit a worker takes no chapter.
  # Scheduled Claude chat sessions (his subscription) write from the same queue at the same time.
  schedule: [ { cron: '17 * * * *' } ]
  workflow_dispatch:
    inputs:
      minutes: { description: 'each worker stops after (min)', default: '300' }
permissions: { contents: read, id-token: write }
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { w: [1, 2, 3, 4, 5, 6, 7, 8] }
    concurrency:
      group: scripts-worker-${{ matrix.w }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: sudo python3 -m pip install -q --break-system-packages num2words wordfreq
      - name: Write chapters
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PART_THREADS: '4'
        run: python3 rscripts/write.py "gh-${{ github.run_id }}-w${{ matrix.w }}" "${{ inputs.minutes || '300' }}"
